<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل ادمین</title>
<style>
:root{--bg:#0a111d;--card:#142033;--line:#27364b;--gold:#d4a73a;--txt:#eef2f7;--mut:#8b9bb0;--err:#ff8a8a;--ok:#3ddc97}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px 16px 60px}
h1,h2{margin:0 0 14px}
input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0;font:inherit;font-size:16px}
input,select{background:#0e1828;color:var(--txt);border:1px solid var(--line)}
button{background:var(--gold);color:#1b1405;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
button:disabled{opacity:.4}
.lbl{color:var(--mut);font-size:14px}
#msg{color:var(--err);min-height:22px;text-align:center}
#toast{position:fixed;bottom:20px;inset-inline:0;text-align:center;pointer-events:none;z-index:30}
.phead{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.phead b{flex:1;font-size:20px}
.phead button{width:auto;margin:0;padding:8px 14px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:40px}
.st{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 12px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:17px;color:var(--gold);direction:ltr}
.st span{font-size:12px;color:var(--mut)}
.fl2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.u{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.u b{display:block;direction:ltr;text-align:start;word-break:break-all}
.u small{display:block;color:var(--mut);line-height:1.8;margin-bottom:6px}
.u.ban{border-color:var(--err)}
.u .why{color:var(--err);margin-bottom:6px}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.f input{margin:4px 0;padding:10px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two button{padding:10px;font-size:14px}
details{margin:6px 0 4px;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--gold);padding:6px 0}
.sep{height:1px;background:var(--line);margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:24px 0}
button.danger{background:#b3372f;color:#fff}
.dz{border-color:#b3372f;margin-top:28px}
.dz b{display:block;color:var(--err);margin-bottom:6px}
.uh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fg{font-size:30px;line-height:1;width:38px;text-align:center;flex:none}
.un{flex:1;min-width:0}
.un small{margin:0}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pb{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pb.on{color:var(--ok);border-color:var(--ok)}
.pb.on::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pb.bn{color:var(--err);border-color:var(--err)}
.pb.bn::before{background:var(--err)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.chips div{background:#0e1828;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:13px;direction:ltr}
.chips div.vip{border-color:var(--gold);color:var(--gold)}
.chips span{display:block;font-size:11px;color:var(--mut);direction:rtl}
.seen{font-size:12px;color:var(--mut);margin-bottom:6px}
.nocty{font-size:13px;color:var(--mut);margin-bottom:8px}
.dv{font-size:12px;color:var(--mut);direction:ltr;text-align:start;margin-bottom:8px;word-break:break-word}
.wn{border:1px solid var(--err);border-radius:10px;padding:8px 10px;margin:0 0 10px;background:rgba(255,138,138,.07);font-size:13px}
.wn .t{color:var(--err);margin-bottom:4px}
.mb{width:auto;display:inline-block;margin:4px 0 0 6px;padding:5px 11px;font-size:12px;border-radius:99px;background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:400}
.mb.st{border-color:var(--err)}
.mb.wk{border-color:var(--gold)}
#dups{margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ورود -->
  <section id="login" class="box" hidden>
    <h2>ورود ادمین</h2>
    <input id="em" type="email" placeholder="ایمیل" dir="ltr" autocomplete="username">
    <input id="pw" type="password" placeholder="رمز عبور" dir="ltr" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button id="lb" onclick="login()">ورود</button>
  </section>

  <!-- دسترسی ندارد -->
  <section id="denied" class="box" hidden>
    <h2>دسترسی ندارید</h2>
    <p class="lbl">این حساب ادمین نیست.</p>
    <button class="ghost" onclick="logout()">خروج</button>
  </section>

  <!-- پنل -->
  <section id="panel" hidden>
    <div class="phead"><span>🛠️</span><b>پنل ادمین</b><button class="ghost" onclick="logout()">خروج</button></div>
    <div id="astats" class="st"></div>
    <input id="aq" type="search" placeholder="جستجو با شناسه، نام کاربری یا نام کشور…" oninput="searchSoon()" autocomplete="off">
    <div class="fl2">
      <select id="afilter" onchange="search()" aria-label="فیلتر">
        <option value="all">همه</option>
        <option value="vip">فقط VIP</option>
        <option value="banned">فقط بن‌شده‌ها</option>
        <option value="nocountry">بدون کشور</option>
        <option value="inactive">غیرفعال (۲۴ ساعت+)</option>
      </select>
      <select id="asort" onchange="search()" aria-label="مرتب‌سازی">
        <option value="new">جدیدترین</option>
        <option value="treasury">بیشترین خزانه</option>
        <option value="crystals">بیشترین الماس</option>
        <option value="vip">VIP نزدیک به پایان</option>
      </select>
    </div>
    <button class="ghost" id="dupBtn" onclick="loadDups()">🕵️ حساب‌های مشکوک (چند اکانت، یک گوشی)</button>
    <div id="dups"></div>
    <div id="alist"></div>

    <div class="box dz">
      <b>⚠️ منطقه خطر</b>
      <p class="lbl">همه‌ی کشورها آزاد می‌شوند و خزانه، الماس، ساختمان‌ها و تمام پیشرفت بازیکنان پاک می‌شود. حساب بازیکنان، بن‌ها، VIP و سفارش‌ها می‌ماند. این کار برگشت‌پذیر نیست.</p>
      <button class="danger" id="rstBtn" onclick="resetGame()">🔄 ریست کامل بازی</button>
    </div>
  </section>

  <div id="msg"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://ojvafaquuzfvnpyfqady.supabase.co", "sb_publishable_KCBs5O_32ERi2QCWXwsVjw__stzJt9L");
const $ = (id) => document.getElementById(id);
const msg = (t) => ($("msg").textContent = t || "");
const flash = (t, ms) => { $("toast").textContent = t; setTimeout(() => ($("toast").textContent = ""), ms || 1500); };
const fmt = (n) => "$" + Number(n).toLocaleString("en-US");
const flagOf = (code) => String.fromCodePoint(...[...String(code).toUpperCase()].map((c) => 127397 + c.charCodeAt()));
const ONLINE_MS = 75000; // اگر آخرین ضربان کمتر از این بود، آنلاین حساب می‌شود
const faNum = (n) => Math.floor(n).toLocaleString("fa-IR");
function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
  if (s < 60) return "چند لحظه پیش";
  if (s < 3600) return faNum(s / 60) + " دقیقه پیش";
  if (s < 86400) return faNum(s / 3600) + " ساعت پیش";
  if (s < 86400 * 30) return faNum(s / 86400) + " روز پیش";
  return new Date(t).toLocaleDateString("fa-IR");
}

function show(n) { for (const s of ["login", "denied", "panel"]) $(s).hidden = s !== n; msg(""); }

async function login() {
  $("lb").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  $("lb").disabled = false;
  if (error) return msg("ایمیل یا رمز اشتباه است");
  $("pw").value = "";
  enter();
}
async function logout() { await sb.auth.signOut(); cardRefs.clear(); seenMap.clear(); $("alist").replaceChildren(); $("dups").replaceChildren(); $("astats").replaceChildren(); show("login"); }

async function enter() {
  const r = await sb.rpc("is_admin");
  if (r.error || !r.data) return show("denied");
  show("panel");
  await loadFree();
  stats();
  search();
}

let free = [], allC = [], timer = null, lastStats = null, seq = 0, presenceOk = true;
const cardRefs = new Map(), seenMap = new Map();
async function loadFree() {
  const c = await sb.rpc("list_countries");
  if (!c.error) allC = c.data || [];
  free = allC.filter((x) => !x.taken);
}
function countryInfo(v) {
  if (!v) return null;
  const t = String(v).trim(), up = t.toUpperCase();
  const f = allC.find((x) => String(x.code).toUpperCase() === up) || allC.find((x) => x.name_fa === t || x.name === t);
  if (f) return { flag: flagOf(f.code), name: f.name_fa || t };
  if (/^[A-Za-z]{2}$/.test(t)) return { flag: flagOf(t), name: up };
  return { flag: "🏳️", name: t };
}
function paintSeen(uid) {
  const r = cardRefs.get(uid); if (!r) return;
  const t = seenMap.get(uid);
  const on = !!t && Date.now() - new Date(t).getTime() < ONLINE_MS;
  r.pb.className = "pb" + (on ? " on" : "");
  r.pb.textContent = presenceOk ? (on ? "آنلاین" : "آفلاین") : "نامشخص";
  r.sn.textContent = "آخرین بازدید: " + (on ? "همین الان" : t ? ago(t) : presenceOk ? "ثبت نشده" : "نامشخص");
  r.sn.title = t ? new Date(t).toLocaleString("fa-IR") : "";
}
async function loadPresence() {
  const ids = [...cardRefs.keys()]; if (!ids.length) return;
  const r = await sb.rpc("admin_last_seen", { p_users: ids });
  presenceOk = !r.error;
  if (!r.error) (r.data || []).forEach((x) => seenMap.set(x.user_id, x.last_seen));
  ids.forEach(paintSeen);
}
setInterval(() => { if (!$("panel").hidden && document.visibilityState === "visible") loadPresence(); }, 30000);

const PLAT = { android: "Android", ios: "iOS", tdesktop: "Desktop", macos: "macOS", weba: "Web", webk: "Web", unigram: "Windows" };
function devLine(i) {
  if (!i) return "—";
  const g = String(i.gpu || "").replace(/^ANGLE \(/, "").replace(/\)$/, "").slice(0, 44);
  return [PLAT[i.platform] || i.platform || "?", i.model, g, i.scr].filter(Boolean).join(" · ");
}
function memberBtn(m, kind) {
  const b = document.createElement("button");
  b.className = "mb " + (kind === "device" ? "st" : "wk");
  b.textContent = (kind === "device" ? "🔴 " : "🟡 ") + (m.name ? "@" + m.name : "") + " #" + (m.no || "—");
  if (!m.no && !m.name) b.disabled = true;
  b.onclick = () => { $("afilter").value = "all"; $("aq").value = m.no || m.name || ""; search(); window.scrollTo({ top: $("alist").offsetTop - 10, behavior: "smooth" }); };
  return b;
}
async function loadDevices() {
  const ids = [...cardRefs.keys()]; if (!ids.length) return;
  const [a, b] = await Promise.all([sb.rpc("admin_device_info", { p_users: ids }), sb.rpc("admin_device_matches", { p_users: ids })]);
  const ok = !a.error && !b.error;
  const info = new Map(), mt = new Map();
  (a.data || []).forEach((x) => info.set(x.user_id, x));
  (b.data || []).forEach((x) => { if (!mt.has(x.user_id)) mt.set(x.user_id, []); mt.get(x.user_id).push(x); });
  ids.forEach((id) => {
    const r = cardRefs.get(id); if (!r) return;
    const i = info.get(id);
    r.dv.textContent = !ok ? "📱 نامشخص" : i ? "📱 " + devLine(i.info) : "📱 دستگاه ثبت نشده";
    r.wn.replaceChildren();
    const ms = (mt.get(id) || []).sort((x, y) => (x.kind === y.kind ? 0 : x.kind === "device" ? -1 : 1));
    r.wn.hidden = !ms.length;
    if (!ms.length) return;
    const t = document.createElement("div"); t.className = "t";
    t.textContent = "⚠️ " + faNum(ms.length) + " حساب دیگر با این گوشی" + (ms.some((m) => m.kind === "device") ? "" : " (مشخصات مشابه)");
    r.wn.append(t);
    ms.forEach((m) => r.wn.append(memberBtn({ no: m.other_no, name: m.other_name }, m.kind)));
  });
}
async function loadDups() {
  const box = $("dups"), btn = $("dupBtn");
  box.replaceChildren(); btn.disabled = true;
  const r = await sb.rpc("admin_shared_accounts");
  btn.disabled = false;
  if (r.error) return flash(r.error.message, 3500);
  const groups = new Map();
  (r.data || []).forEach((x) => {
    const k = x.kind + ":" + x.grp;
    if (!groups.has(k)) groups.set(k, { kind: x.kind, m: [] });
    groups.get(k).m.push({ id: x.user_id, no: x.player_no, name: x.username });
  });
  const key = (g) => g.m.map((m) => m.id).sort().join();
  const all = [...groups.values()];
  const strong = new Set(all.filter((g) => g.kind === "device").map(key));
  const list = all.filter((g) => g.kind === "device" || !strong.has(key(g)))
    .sort((a, b) => (a.kind === b.kind ? 0 : a.kind === "device" ? -1 : 1) || b.m.length - a.m.length);
  if (!list.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "مورد مشکوکی پیدا نشد"; return box.append(e); }
  list.forEach((g) => {
    const w = document.createElement("div"); w.className = "wn";
    const t = document.createElement("div"); t.className = "t";
    t.textContent = (g.kind === "device" ? "🔴 یک دستگاه · " : "🟡 مشخصات یکسان · ") + faNum(g.m.length) + " حساب";
    w.append(t);
    g.m.forEach((m) => w.append(memberBtn(m, g.kind)));
    box.append(w);
  });
}
function searchSoon() { clearTimeout(timer); timer = setTimeout(search, 350); }

async function stats() {
  const { data, error } = await sb.rpc("admin_stats");
  lastStats = data || null;
  const box = $("astats");
  box.replaceChildren();
  if (error || !data) return;
  const n = (x) => Number(x).toLocaleString("en-US");
  [
    ["بازیکن", n(data.players)],
    ["ثبت‌نام ۲۴ ساعت", n(data.new_24h)],
    ["کشور گرفته‌شده", n(data.countries_taken) + "/" + n(data.countries_total)],
    ["VIP فعال", n(data.vip_active)],
    ["بن‌شده", n(data.banned)],
    ["الماس کل", n(data.total_crystals)],
    ["مجموع خزانه", "$" + n(data.total_treasury)],
  ].forEach(([l, v]) => {
    const d = document.createElement("div");
    const b = document.createElement("b"); b.textContent = v;
    const sp = document.createElement("span"); sp.textContent = l;
    d.append(b, sp);
    box.append(d);
  });
}

async function search() {
  const my = ++seq;
  const { data, error } = await sb.rpc("admin_search", {
    p_q: $("aq").value.trim(), p_filter: $("afilter").value, p_sort: $("asort").value,
  });
  if (my !== seq) return; // جواب درخواست قدیمی‌تر
  if (error) return msg(error.message);
  msg("");
  const box = $("alist");
  box.replaceChildren();
  cardRefs.clear();
  const rows = data || [];
  if (!rows.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "کاربری پیدا نشد";
    return box.append(e);
  }
  rows.forEach((u) => box.append(card(u)));
  loadPresence();
  loadDevices();
}

async function notifyUser(body) {
  try {
    const { data, error } = await sb.functions.invoke("notify-user", { body });
    if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) {} return m; }
    if (data && data.ok === false) return data.detail || "ارسال ناموفق";
    return null;
  } catch (e) { return e.message; }
}

function card(u) {
  const who = u.username ? "@" + u.username : (u.email || "—");
  const d = document.createElement("div");
  d.className = "u" + (u.banned ? " ban" : "");
  const ci = countryInfo(u.country);
  const h = document.createElement("div"); h.className = "uh";
  const fg = document.createElement("span"); fg.className = "fg"; fg.textContent = ci ? ci.flag : "👤";
  const un = document.createElement("div"); un.className = "un";
  const e = document.createElement("b"); e.textContent = who;
  const s = document.createElement("small"); s.textContent = (ci ? ci.name + " · " : "") + "شناسه " + (u.player_no || "—");
  un.append(e, s);
  const side = document.createElement("div"); side.className = "side";
  const pb = document.createElement("span"); pb.className = "pb";
  side.append(pb);
  if (u.banned) { const bn = document.createElement("span"); bn.className = "pb bn"; bn.textContent = "بن‌شده"; side.append(bn); }
  h.append(fg, un, side);
  d.append(h);

  if (u.country) {
    const vipOn = u.vip_until && new Date(u.vip_until) > new Date();
    const ch = document.createElement("div"); ch.className = "chips";
    [["خزانه", fmt(u.treasury), ""], ["الماس", "💎 " + Number(u.crystals || 0).toLocaleString("en-US"), ""],
     ["VIP", vipOn ? new Date(u.vip_until).toLocaleDateString("fa-IR") : "ندارد", vipOn ? "vip" : ""]].forEach(([l, v, c]) => {
      const x = document.createElement("div"); if (c) x.className = c;
      x.append(v); const sp = document.createElement("span"); sp.textContent = l; x.append(sp); ch.append(x);
    });
    d.append(ch);
  } else {
    const nc = document.createElement("div"); nc.className = "nocty"; nc.textContent = "هنوز کشور انتخاب نکرده";
    d.append(nc);
  }
  const sn = document.createElement("div"); sn.className = "seen";
  d.append(sn);
  const dv = document.createElement("div"); dv.className = "dv"; dv.textContent = "📱 …";
  const wn = document.createElement("div"); wn.className = "wn"; wn.hidden = true;
  d.append(dv, wn);
  cardRefs.set(u.user_id, { pb, sn, dv, wn });
  paintSeen(u.user_id);
  if (u.banned && u.ban_reason) {
    const w = document.createElement("small"); w.className = "why"; w.textContent = "دلیل بن: " + u.ban_reason;
    d.append(w);
  }

  const run = async (name, args, okText, btn, note) => {
    if (btn) btn.disabled = true;
    const { error } = await sb.rpc(name, args);
    if (btn) btn.disabled = false;
    if (error) return flash(error.message, 3500);
    if (note) {
      const m = await notifyUser(note);
      flash(m ? "انجام شد، اما پیام به کاربر نرفت: " + m : "انجام شد و پیام به کاربر رفت", 3500);
    } else flash(okText || "انجام شد");
    await loadFree();
    search();
    stats();
  };

  const det = document.createElement("details");
  const sm = document.createElement("summary"); sm.textContent = "⚙️ عملیات";
  det.append(sm);

  const mk = (ph) => { const i = document.createElement("input"); i.type = "number"; i.inputMode = "numeric"; i.min = "0"; i.placeholder = ph; return i; };
  if (u.country) {
    const f = document.createElement("div"); f.className = "f";
    const t = mk("پول"), c = mk("الماس"), v = mk("روز VIP");
    f.append(t, c, v);
    const two = document.createElement("div"); two.className = "two";
    const add = document.createElement("button"); add.textContent = "➕ اضافه";
    const sub = document.createElement("button"); sub.className = "ghost"; sub.textContent = "➖ کم کردن";
    const go = (sign, btn) => {
      const a = { p_user: u.user_id, p_treasury: Math.abs(Number(t.value || 0)) * sign, p_crystals: Math.abs(Number(c.value || 0)) * sign, p_vip_days: Math.abs(Number(v.value || 0)) * sign };
      if (!a.p_treasury && !a.p_crystals && !a.p_vip_days) return flash("مقداری وارد نشده");
      run("admin_grant", a, "انجام شد", btn, { kind: "grant", user_id: u.user_id, treasury: a.p_treasury, crystals: a.p_crystals, vip_days: a.p_vip_days });
    };
    add.onclick = () => go(1, add);
    sub.onclick = () => go(-1, sub);
    two.append(add, sub);
    det.append(f, two);

    const sep = document.createElement("div"); sep.className = "sep";
    const sel = document.createElement("select");
    const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "تغییر کشور به…";
    sel.append(o0);
    free.forEach((x) => {
      const o = document.createElement("option"); o.value = x.code; o.textContent = flagOf(x.code) + " " + x.name_fa;
      sel.append(o);
    });
    const mv = document.createElement("button"); mv.textContent = "تغییر کشور";
    mv.onclick = () => {
      if (!sel.value) return flash("کشوری انتخاب نشده");
      const nm = sel.options[sel.selectedIndex].textContent;
      if (!confirm(who + " به " + nm + " منتقل شود؟ درآمد و قدرت اولیه کشور جدید جایگزین می‌شود، خزانه و الماس می‌ماند.")) return;
      run("admin_move_country", { p_user: u.user_id, p_code: sel.value }, "کشور عوض شد", mv);
    };
    const rel = document.createElement("button"); rel.className = "ghost"; rel.textContent = "آزاد کردن کشور";
    rel.onclick = () => {
      if (!confirm("کشور " + (ci ? ci.name : u.country) + " از " + who + " گرفته شود؟ خزانه و الماس این کشور پاک می‌شود.")) return;
      run("admin_release_country", { p_user: u.user_id }, "کشور آزاد شد", rel);
    };
    det.append(sep, sel, mv, rel);
  }
  d.append(det);

  const bb = document.createElement("button");
  bb.className = "ghost";
  bb.textContent = u.banned ? "رفع بن" : "بن کردن";
  bb.onclick = () => {
    let reason = "";
    if (u.banned) {
      if (!confirm("رفع بن " + who + "؟")) return;
    } else {
      reason = prompt("دلیل بن " + who + " (اختیاری):");
      if (reason === null) return;
    }
    run("admin_ban", { p_user: u.user_id, p_ban: !u.banned, p_reason: reason.trim() || null }, "انجام شد", bb,
      { kind: u.banned ? "unban" : "ban", user_id: u.user_id, reason: reason.trim() || null });
  };
  d.append(bb);
  return d;
}

async function resetGame() {
  const st = lastStats || {};
  const n = (x) => Number(x || 0).toLocaleString("en-US");
  if (!confirm(
    "⚠️ ریست کامل بازی\n\n" +
    "همه‌ی کشورها آزاد می‌شوند و خزانه، الماس، ساختمان‌ها و تمام پیشرفت همه‌ی بازیکنان پاک می‌شود.\n\n" +
    "الان: " + n(st.countries_taken) + " کشور گرفته‌شده، " + n(st.players) + " بازیکن، " + n(st.total_crystals) + " الماس.\n\n" +
    "می‌ماند: حساب بازیکنان، بن‌ها، VIP و سفارش‌ها.\n\n" +
    "این کار برگشت‌پذیر نیست. ادامه می‌دهید؟"
  )) return;
  const w = prompt("برای تأیید نهایی، کلمه‌ی «ریست» را تایپ کنید:");
  if (w === null) return;
  if (w.trim() !== "ریست") return flash("تأیید نشد؛ ریست انجام نشد", 3000);
  const b = $("rstBtn"); b.disabled = true;
  const { data, error } = await sb.rpc("admin_reset_game", { p_confirm: "RESET" });
  b.disabled = false;
  if (error) return flash(error.message, 4000);
  flash("✅ بازی ریست شد · " + n(data && data.countries_freed) + " کشور آزاد شد", 5000);
  await loadFree();
  stats();
  search();
}

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(); else show("login");
})();
</script>
